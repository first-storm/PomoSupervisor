[package]
name = "pomo-supervisor"
version = "0.1.0"
description = "A menu-bar pomodoro timer that watches the frontmost window and says when you drift off the task"
authors = ["LMFuture"]
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
# Not the package name: a lib and a bin of the same name collide on Windows (rust-lang/cargo#8519).
name = "pomo_supervisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
rig-core = { version = "0.47", features = ["reqwest"] }
tokio = { version = "1.54.1", features = ["full"] }
active-win-pos-rs = "0.11"
user-idle = "0.6"
xcap = "0.9"
image_hasher = "3"
base64 = "0.22"
url = "2.5.9"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
lru = "0.19.1"
futures = "0.3.34"
# Decision-model endpoints (rig has no client for them); same features rig-reqwest builds, so no second TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Activate the app when the popover opens from the tray, so clicking elsewhere hides it.
objc2 = "0.6"
# Accessibility API: window text for the text model.
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
